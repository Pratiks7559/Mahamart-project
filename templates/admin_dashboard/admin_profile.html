{% load static %}
{% include 'includes/admin_shell_start.html' with page_title='Admin Profile' %}

<div class="admin-card" style="max-width: 600px; margin: 0 auto;">
    <div class="admin-card-header">
        <h3>👤 My Profile</h3>
    </div>
    <div class="admin-card-body">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; color: white; font-weight: 700;">
                {{ user.username|slice:":1"|upper }}
            </div>
            <h2>{{ user.username }}</h2>
            <p style="color: #6c757d;">
                <span class="badge badge-primary">Super Admin</span>
            </p>
        </div>
        
        <form method="POST" action="{% url 'admin_dashboard:admin_profile' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" value="{{ user.username }}" class="form-input" disabled style="background: #f5f5f5;">
            </div>
            
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" class="form-input">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;">
                Update Profile
            </button>
        </form>
    </div>
</div>

<style>
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #2c3e50;
}

.form-input {
    width: 100%;
    padding: 10px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
}

.form-input:focus {
    border-color: #667eea;
    outline: none;
}

.btn {
    transition: transform 0.3s, box-shadow 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
}
</style>
{% include 'includes/admin_shell_end.html' %}
